[package]
name = "porthole"
version = "0.1.0"
description = "Porthole"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "porthole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde_json = "1.0"
base64="0.23"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "io-util", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9.0"


